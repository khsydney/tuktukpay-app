# TukTukPay — "11.11 War Room" workshop stack, Datadog edition (branch tuktukpay-app-with-DD)
#
#   cp .env.example .env      # add DD_API_KEY (and DD_SITE if not datadoghq.com)
#   docker compose up -d --build
#   open http://localhost:8090   (chaos controls)
#
# Every service runs its Datadog tracer (ddtrace-run, dd-trace, dd-java-agent, dd-trace-go) and
# sends to the datadog-agent container: traces on 8126, OpenTelemetry metrics on 4318 (OTLP/HTTP),
# container stdout logs through the Docker socket.

name: tuktukpay-workshop   # fixes image names (tuktukpay-workshop-<service>) whatever the folder is called

x-dd-env: &dd-env
  DD_AGENT_HOST: datadog-agent
  DD_ENV: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
  DD_VERSION: ${SERVICE_VERSION:-2026.09.1}
  DD_TRACE_OTEL_ENABLED: "true"        # the services' opentelemetry API calls become Datadog spans
  DD_METRICS_OTEL_ENABLED: "true"      # tuktukpay.* metrics (OpenTelemetry API) -> OTLP -> Datadog Agent
  DD_LOGS_INJECTION: "true"
  DD_RUNTIME_METRICS_ENABLED: "true"
  DD_PROFILING_ENABLED: ${DD_PROFILING_ENABLED:-true}
  DD_TRACE_PROPAGATION_STYLE: datadog,tracecontext,baggage
  DD_TRACE_SAMPLING_RULES: '[{"resource":"GET /healthz","sample_rate":0}]'
  OTEL_EXPORTER_OTLP_ENDPOINT: http://datadog-agent:4318
  OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
  OTEL_RESOURCE_ATTRIBUTES: deployment.environment=${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01},service.namespace=tuktukpay,service.version=${SERVICE_VERSION:-2026.09.1}
  OTEL_PROPAGATORS: tracecontext,baggage
  CHAOS_URL: http://chaos-controller:8090

x-python-dd-env: &python-dd-env
  <<: *dd-env
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

x-node-dd-env: &node-dd-env
  <<: *dd-env
  LOG_LEVEL: ${LOG_LEVEL:-info}

services:
  # ---------------------------------------------------------------- telemetry
  datadog-agent:
    image: gcr.io/datadoghq/agent:7.86.0
    container_name: datadog-agent
    environment:
      DD_API_KEY: ${DD_API_KEY:?set DD_API_KEY in .env}
      DD_SITE: ${DD_SITE:-datadoghq.com}
      DD_ENV: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      DD_HOSTNAME: tuktukpay-compose
      DD_APM_ENABLED: "true"
      DD_APM_NON_LOCAL_TRAFFIC: "true"
      DD_DOGSTATSD_NON_LOCAL_TRAFFIC: "true"
      DD_LOGS_ENABLED: "true"
      DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
      DD_CONTAINER_EXCLUDE_LOGS: "name:datadog-agent"
      DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: 0.0.0.0:4318
      DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /proc/:/host/proc/:ro
      - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    ports:
      - "8126:8126"     # APM traces
      - "8125:8125/udp" # DogStatsD
      - "4318:4318"     # OTLP/HTTP (OpenTelemetry metrics)
    restart: unless-stopped

  # ---------------------------------------------------------------- data stores
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: tuktukpay
      POSTGRES_PASSWORD: tuktukpay
      POSTGRES_DB: tuktukpay
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuktukpay -d tuktukpay"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------------------------------------------------------------- workshop tooling
  chaos-controller:
    build: ./services/chaos-controller
    container_name: chaos-controller
    ports:
      - "8090:8090"
    restart: unless-stopped

  # ---------------------------------------------------------------- payment platform
  checkout-api:            # Go — public payments API (OpenTelemetry API on dd-trace-go)
    build: ./services/checkout-api
    container_name: checkout-api
    labels:
      com.datadoghq.tags.service: checkout-api
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *dd-env
      OTEL_SERVICE_NAME: checkout-api
      DD_SERVICE: checkout-api
      LOG_LEVEL: ${LOG_LEVEL:-info}   # slog level; logs go to stdout (JSON), collected by the Datadog Agent
      PORT: "8080"
      RISK_URL: http://risk-engine:8081
      ROUTER_URL: http://payment-router:8082
      LEDGER_URL: http://ledger:8084
      WALLET_URL: http://wallet-sim:8088
      AMP_SHARED_SECRET: ${AMP_SHARED_SECRET:-tuktukpay-amp-demo-secret}
      REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    depends_on:
      redis: { condition: service_healthy }
      datadog-agent: { condition: service_started }
    restart: unless-stopped

  risk-engine:             # Python — fraud/risk scoring (ddtrace-run)
    build: ./services/risk-engine
    container_name: risk-engine
    labels:
      com.datadoghq.tags.service: risk-engine
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: risk-engine
      DD_SERVICE: risk-engine
    ports:
      - "8081:8081"
    restart: unless-stopped

  payment-router:          # Java 21 — acquirer routing + failover (dd-java-agent)
    build: ./services/payment-router
    container_name: payment-router
    labels:
      com.datadoghq.tags.service: payment-router
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *dd-env
      OTEL_SERVICE_NAME: payment-router
      DD_SERVICE: payment-router
      JAVA_TOOL_OPTIONS: -javaagent:/dd/dd-java-agent.jar -Ddd.trace.otel.enabled=true
      LOG_LEVEL: ${LOG_LEVEL:-info}
      ACQUIRER_URL: http://acquirer-sim:8083
      ACQUIRER_TIMEOUT_MS: "2500"
      PORT: "8082"
    ports:
      - "8082:8082"
    restart: unless-stopped

  acquirer-sim:            # Node.js — simulated acquirers & wallet rails (zero-code)
    build: ./services/acquirer-sim
    container_name: acquirer-sim
    labels:
      com.datadoghq.tags.service: acquirer-sim
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *node-dd-env
      OTEL_SERVICE_NAME: acquirer-sim
      DD_SERVICE: acquirer-sim
      PORT: "8083"
    ports:
      - "8083:8083"
    restart: unless-stopped

  ledger:                  # Node.js + PostgreSQL — system of record (zero-code). .NET variant: docker-compose.dotnet.yml
    build: ./services/ledger
    container_name: ledger
    labels:
      com.datadoghq.tags.service: ledger
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *node-dd-env
      OTEL_SERVICE_NAME: ledger
      DD_SERVICE: ledger
      PORT: "8084"
      DATABASE_URL: postgres://tuktukpay:tuktukpay@postgres:5432/tuktukpay
      PG_POOL_SIZE: "10"
    ports:
      - "8084:8084"
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped

  webhook-dispatcher:      # Python worker — async merchant webhooks via Redis Streams
    build: ./services/webhook-dispatcher
    container_name: webhook-dispatcher
    labels:
      com.datadoghq.tags.service: webhook-dispatcher
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    command: ["ddtrace-run", "python", "worker.py"]
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: webhook-dispatcher
      DD_SERVICE: webhook-dispatcher
      REDIS_URL: redis://redis:6379/0
      MERCHANT_SIM_URL: http://merchant-sim:8085
    depends_on:
      redis: { condition: service_healthy }
    restart: unless-stopped

  merchant-sim:            # Python — merchants' webhook endpoints
    build: ./services/webhook-dispatcher
    container_name: merchant-sim
    labels:
      com.datadoghq.tags.service: merchant-sim
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    command: ["ddtrace-run", "uvicorn", "merchant_sim:app", "--host", "0.0.0.0", "--port", "8085", "--no-access-log"]
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: merchant-sim
      DD_SERVICE: merchant-sim
    ports:
      - "8085:8085"
    restart: unless-stopped

  merchant-copilot:        # Python — LLM agent (GenAI semantic conventions)
    build: ./services/merchant-copilot
    container_name: merchant-copilot
    labels:
      com.datadoghq.tags.service: merchant-copilot
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: merchant-copilot
      DD_SERVICE: merchant-copilot
      LEDGER_URL: http://ledger:8084
      COPILOT_PROVIDER: ${COPILOT_PROVIDER:-mock}
      COPILOT_MODEL: ${COPILOT_MODEL:-}
      COPILOT_GUARDRAIL: ${COPILOT_GUARDRAIL:-on}
      COPILOT_CAPTURE_CONTENT: ${COPILOT_CAPTURE_CONTENT:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    ports:
      - "8086:8086"
    restart: unless-stopped

  wallet-sim:              # Python — consumer wallet: AMP task mandates + Know-Your-Agent registry
    build: ./services/agent-console
    container_name: wallet-sim
    labels:
      com.datadoghq.tags.service: wallet-sim
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    command: ["ddtrace-run", "uvicorn", "wallet_sim:app", "--host", "0.0.0.0", "--port", "8088", "--no-access-log"]
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: wallet-sim
      DD_SERVICE: wallet-sim
      AMP_SHARED_SECRET: ${AMP_SHARED_SECRET:-tuktukpay-amp-demo-secret}
    ports:
      - "8088:8088"
    restart: unless-stopped

  shopping-agent:          # Python — AI shopping agent + Agentic Checkout Console (http://localhost:8087)
    build: ./services/agent-console
    container_name: shopping-agent
    labels:
      com.datadoghq.tags.service: shopping-agent
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: shopping-agent
      DD_SERVICE: shopping-agent
      CHECKOUT_URL: http://checkout-api:8080
      WALLET_URL: http://wallet-sim:8088
      MERCHANT_SIM_URL: http://merchant-sim:8085
      CONSOLE_DD_SITE: ${DD_SITE:-datadoghq.com}   # for 'open trace in Datadog' links only
      AMP_SHARED_SECRET: ${AMP_SHARED_SECRET:-tuktukpay-amp-demo-secret}
      AGENT_PROVIDER: ${AGENT_PROVIDER:-mock}
      AGENT_MODEL: ${AGENT_MODEL:-}
      AGENT_GUARDRAIL: ${AGENT_GUARDRAIL:-flag}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-ap-southeast-1}
    ports:
      - "8087:8087"
    depends_on:
      - checkout-api
      - wallet-sim
      - merchant-sim
    restart: unless-stopped

  loadgen:                 # Python — merchants' storefronts calling the API + asking the copilot
    build: ./services/loadgen
    container_name: merchant-storefront
    labels:
      com.datadoghq.tags.service: merchant-storefront
      com.datadoghq.tags.env: ${DEPLOYMENT_ENVIRONMENT:-tuktukpay-team01}
      com.datadoghq.tags.version: ${SERVICE_VERSION:-2026.09.1}
    environment:
      <<: *python-dd-env
      OTEL_SERVICE_NAME: merchant-storefront
      DD_SERVICE: merchant-storefront
      CHECKOUT_URL: http://checkout-api:8080
      COPILOT_URL: http://merchant-copilot:8086
      BASE_RPS: ${BASE_RPS:-4}
      COPILOT_INTERVAL_S: ${COPILOT_INTERVAL_S:-8}
      AMP_SHARED_SECRET: ${AMP_SHARED_SECRET:-tuktukpay-amp-demo-secret}
    depends_on:
      - checkout-api
      - merchant-copilot
    restart: unless-stopped

volumes:
  pgdata:
